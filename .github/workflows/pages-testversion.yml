name: Deploy Test Version to Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'testversion/**'
      - '.github/workflows/pages-testversion.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-testversion"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create redirect page
        run: |
          mkdir -p temp
          cat > temp/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Redirecting to Yamli Mobile v2.0...</title>
              <meta http-equiv="refresh" content="0; url=/testversion/">
              <script>
                  window.location.href = "/testversion/";
              </script>
          </head>
          <body>
              <p>Redirecting to <a href="/testversion/">Yamli Mobile v2.0</a>...</p>
          </body>
          </html>
          EOF

      - name: Create v2.0 version page
        run: |
          mkdir -p temp
          cat > temp/index.html << 'EOF'
          <!doctype html><html lang="ar">
          <head>
            <meta charset = "utf-8" />
            <title>Yamli Mobile v2.0</title>
            <meta name="msapplication-TileColor" content="#3b5165">
            <meta name="msapplication-TileImage" content="/images/favicon/favicon-32x32.png">
            <meta name="theme-color" content="#3b5165">
            <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=0' />
            <meta name="mobile-web-app-capable" content"yes">
            <meta name="apple-mobile-web-app-capable" content"yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black">
            <meta name="apple-mobile-web-app-title" content"Yamli Mobile v2.0">
            <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
            <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
            <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
            <link rel="manifest" href="/site.webmanifest">
            <link rel="stylesheet" href="testversion/style.css">
            <script src="testversion/index.js" defer></script>
            <script src="testversion/listen.js"></script>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300&display=swap" rel="stylesheet">
            <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
            <link href="https://fonts.googleapis.com/css2?family=Gulzar&display=swap" rel="stylesheet">
            <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Naskh+Arabic&display=swap" rel="stylesheet">
            <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
            <script type="text/javascript" src="script.js"></script>
          </head>
          <body>
          <div id="versionBadge">v2.0</div>
          <div id="copyNotification">Text copied</div>
          <div id="languagePrompt">
            <div id="languageGrid">
              <button onclick="translateText('en')">English</button>
              <button onclick="translateText('de')">Deutsch</button>
              <button onclick="translateText('fr')">Français</button>
              <button onclick="translateText('es')">Español</button>
              <button onclick="translateText('zh-CN')">中文</button>
              <button onclick="translateText('it')">Italiano</button>
            </div>
            <br>
            <button id="cancelbutton" onclick="hideLanguagePrompt()">🗙</button>
          </div>
          <div class="container">
            <div class="button-container">
              <div class="button" id="btn_01" onclick="window.open(window.location.href, '_blank')"><img src="./images/newtab.svg"></div>
              <div class="button" id="btn_06" ><img src="./images/share.svg"></div>
              <div class="button" id="btn_02" onclick = "searchtext()" ><img src="./images/search.svg"></div>
              <div class="button" id="btn_03" onclick = "fct_cut()"><img src="./images/cut.svg"></div>
              <div class="button" id="btn_04" onclick = "pasteFromClipboard()"><img src="./images/paste.svg"></div>
              <div class="button" id="btn_05" onclick = "selectAndCopy()"><img src="./images/copy.svg"></div>
              <div class="button" id="btn_07" onclick = "showLanguagePrompt()"><img src="./images/translate.svg"></div>
            </div>
            <div name="myForm" class="center">
              <textarea class="field-input" name="myTextArea" type="text" id="textbox_id_1" onChange="updateConf()" onkeyup="updateConf()" placeholder="Oktob hona..اكتب هنا" autocomplete="on" autofocus></textarea>
              <form style="display: none" name="testform">
                <p  name="TextArea_vide" id="textbox_id_2" ></p>
              </form>
            </div>
          </div>
          </div>
          <div class="box" id="info">
            <h1>من هو يملي موبايل v2.0 🟐</h1>
            <p class="info">يتيح يملي موبايل للمستخدمين الكتابة باللغة العربية بدون لوحة مفاتيح عربية ، من داخل متصفح الويب الخاص بهم و خاصةً على الهواتف الذكية . تعتمد هذه التقنية على محرك التحويل الحرفي في الوقت الفعلي والذي يحول الكلمات المكتوبة بأحرف لاتينية إلى أقرب ما يعادلها باللغة العربية. تعتمد هذه الخدمة على محرك  يملي عربي ، وهو محرك بحث يركز على تقديم نتائج بحث أكثر صلة لاستعلام عربي من خلال توسيعه ليشمل التمثيلات اللاتينية الأكثر استخدامًا.</p>
            <p class="info">يمكن للمستخدم أيضاً من خلال هذه الخدمة أن يقوم بنسخ ، لصق، حدف، البحث على جوجل و مشاركة النص عبر التطبيقات.</p>
          </div>
          <script>
          document.getElementById('versionBadge').textContent = 'v2.0';
          </script>
          <script src="https://api.yamli.com/js/yamli_api.js"></script>
          <script type="text/javascript">
            if (typeof(Yamli) == "object" && Yamli.init( { uiLanguage: "ar" ,  startMode: "onOrUserDefault" , uiFontFamily: 'Amiri' , settingsColor: '#dbb44f' , settingsLinkColor: '#dbb44f'} ))
            {
              Yamli.yamlify( "textbox_id_1", { settingsPlacement: 'inside' , showTutorialLink: true, showDirectionLink: true} );
            }
          </script>
          <script src="testversion/yamli_spacebar_handler_v4.js"></script>
          </body>
          </html>
          EOF

      - name: Copy remaining files
        run: |
          cp -r testversion/css temp/ 2>/dev/null || true
          cp -r testversion/js temp/ 2>/dev/null || true
          cp -r testversion/images temp/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./temp
          name: testversion-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4