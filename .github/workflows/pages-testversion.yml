name: Deploy Test Version to Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'testversion/**'
      - '.github/workflows/pages-testversion.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-testversion"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create redirect page
        run: |
          mkdir -p temp
          cat > temp/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Redirecting to Yamli Mobile v2.0...</title>
              <meta http-equiv="refresh" content="0; url=/testversion/">
              <script>
                  window.location.href = "/testversion/";
              </script>
          </head>
          <body>
              <p>Redirecting to <a href="/testversion/">Yamli Mobile v2.0</a>...</p>
          </body>
          </html>
          EOF

      - name: Copy testversion files
        run: |
          cp -r testversion/* temp/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./temp
          name: testversion-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4