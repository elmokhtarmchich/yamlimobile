name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, testversion ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout main branch (v1.0)
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: ./v1-src

      # Checkout testversion branch (v2.0)
      - name: Checkout testversion branch
        uses: actions/checkout@v4
        with:
          ref: testversion
          path: ./v2-src
          fetch-depth: 0

      # Create output directory
      - name: Create output directory
        run: mkdir -p _site/v2

      # Copy v1.0 files from main branch
      - name: Copy v1.0 files
        run: |
          echo "Checking current directory contents..."
          ls -la
          echo "Copying files to _site..."
          cp -r *.html _site/ || true
          cp -r *.css _site/ || true
          cp -r *.js _site/ || true
          cp -r *.xml _site/ || true
          cp -r *.txt _site/ || true
          cp -r *.toml _site/ || true
          cp -r *.webmanifest _site/ || true
          cp -r *.json _site/ || true
          cp -r images/ _site/ || true
          cp -r font/ _site/ || true
          cp -r icon/ _site/ || true
          cp -r android-keyboard/ _site/ || true
          cp -r workers/ _site/ || true
          cp -r .nojekyll _site/ 2>/dev/null || true
          cp -r sw.js _site/ || true
          cp -r wrangler.toml _site/ || true
          cp -r CNAME _site/ 2>/dev/null || true
          cp -r site.webmanifest _site/ 2>/dev/null || true
          echo "Files in _site:"
          ls -la _site/

      # Copy v2.0 files from testversion branch
      - name: Copy v2.0 files
        run: |
          echo "Checking testversion branch..."
          git ls-tree --name-only testversion
          echo "Creating _site/v2 directory..."
          mkdir -p _site/v2
          echo "Copying v2.0 files to _site/v2/..."
          git checkout-index -a -f --prefix=_site/v2/ -- testversion
          echo "Files in _site/v2/:"
          ls -la _site/v2/

          # Fix absolute paths in v2.0 files for subdirectory deployment
          cd _site/v2

          # Fix manifest paths
          sed -i 's|href="/images|href="./images|g' site.webmanifest 2>/dev/null || true
          sed -i 's|src="/images|src="./images|g' site.webmanifest 2>/dev/null || true
          sed -i 's|"action": "/"|"action": "/v2/"|g' site.webmanifest 2>/dev/null || true
          sed -i 's|"start_url": "/index.html"|"start_url": "/v2/index.html"|g' site.webmanifest 2>/dev/null || true

          # Fix HTML href/src paths
          sed -i 's|href="/images|href="./images|g' *.html 2>/dev/null || true
          sed -i 's|src="/images|src="./images|g' *.html 2>/dev/null || true

          cd -

      # Create .nojekyll file
      - name: Create .nojekyll
        run: touch _site/.nojekyll

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
