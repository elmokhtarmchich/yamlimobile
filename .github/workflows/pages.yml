name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, testversion ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout main branch (v1.0)
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: ./v1-src

      # Checkout testversion branch (v2.0)
      - name: Checkout testversion branch
        uses: actions/checkout@v4
        with:
          ref: testversion
          path: ./v2-src
          fetch-depth: 0

      # Create output directory
      - name: Create output directory
        run: mkdir -p _site/v2

      # Copy v1.0 files from main branch
      - name: Copy v1.0 files
        run: |
          cp -r v1-src/* _site/ || true
          cp -r v1-src/.[^.]* _site/ 2>/dev/null || true

      # Copy v2.0 files from testversion branch
      - name: Copy v2.0 files
        run: |
          echo "Checking v2-src contents..."
          ls -la v2-src/
          echo "Copying files to _site/v2/..."
          cp -r v2-src/* _site/v2/ || true
          cp -r v2-src/.[^.]* _site/v2/ 2>/dev/null || true
          echo "Files in _site/v2/:"
          ls -la _site/v2/

          # Fix absolute paths in v2.0 files for subdirectory deployment
          cd _site/v2

          # Fix manifest paths
          sed -i 's|href="/images|href="./images|g' site.webmanifest 2>/dev/null || true
          sed -i 's|src="/images|src="./images|g' site.webmanifest 2>/dev/null || true
          sed -i 's|"action": "/"|"action": "/v2/"|g' site.webmanifest 2>/dev/null || true
          sed -i 's|"start_url": "/index.html"|"start_url": "/v2/index.html"|g' site.webmanifest 2>/dev/null || true

          # Fix HTML href/src paths
          sed -i 's|href="/images|href="./images|g' *.html 2>/dev/null || true
          sed -i 's|src="/images|src="./images|g' *.html 2>/dev/null || true

          cd -

      # Copy CNAME file
      - name: Copy CNAME
        run: |
          cp -f v2-src/CNAME _site/CNAME 2>/dev/null || true
          cp -f v1-src/CNAME _site/CNAME 2>/dev/null || true

      # Copy site.webmanifest to root
      - name: Copy site.webmanifest
        run: |
          cp -f v2-src/site.webmanifest _site/site.webmanifest 2>/dev/null || true

      # Create .nojekyll file
      - name: Create .nojekyll
        run: touch _site/.nojekyll

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: pages-artifact

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
